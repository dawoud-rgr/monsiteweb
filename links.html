    <style>
    body {

      margin: 0;
      padding: 0;

    header {
      background: #ffeaea;
      padding: 20px;
      text-align: center;

    }

    nav {
      background: #fff0f0;

      color: #990000;
      text-decoration: underline;
    }

    main {
      max-width: 900px;
      margin: 40px auto;

      border-radius: 10px;

      margin-bottom: 30px;
    }

    h2 {
      border-bottom: 2px solid #cc0000;
      padding-bottom: 8px;
      margin-bottom: 18px;
    }

    ul {
      padding-left: 20px;
    }

    li {
      margin-bottom: 14px;
      font-size: 1.1em;
    }

    a {
      color: #cc0000;
      font-weight: 600;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    a:hover {
