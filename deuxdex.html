<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reports | Dawoud Roger</title>
  <style>
    :root {
      --primary: #1B3C95;
      --bg: #fdfdfd;
      --text: #222222;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    header {
      background: #e4f9f9; /* Light cyan tint to replace the pinkish background */
      padding: 30px 20px;
      text-align: center;
      border-bottom: 2px solid var(--primary);
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(27, 60, 149, 0.08); /* Updated to the RGB equivalent of #1B3C95 */
    }

    .btn-back {
      display: inline-block;
      margin-bottom: 25px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
      transition: 0.2s;
    }

    .btn-back:hover {
      text-decoration: underline;
    }

    h2 {
      color: var(--primary);
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
      margin-top: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th {
      text-align: left;
      background: #f1fcfc; /* Very light cyan tint */
      padding: 12px;
      border-bottom: 2px solid #76E4E6; /* Cyan accent border */
      font-size: 0.9em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    tr:hover {
      background-color: #fdfdfd;
    }

    a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    .tag {
      font-size: 0.75em;
      padding: 3px 8px;
      border-radius: 12px;
      background: #eee;
      color: #666;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>Academic Reports</h1>
    <p>Physics Work and Notes</p>
  </header>

  <main>
    <a href="index.html" class="btn-back">← Back to Main Page</a>

    <section>
      <h2>Theoretical & Computational</h2>
      <table>
        <thead>
          <tr>
            <th>Category</th>
            <th>Description</th>
            <th>File</th>
          </tr>
        </thead>
        <tbody>
          
          <tr>
            <td><span class="tag">Computing</span></td>
            <td>Projet Python</td>
            <td><a href="Projet_Python.pdf" target="_blank">PDF</a></td>
          </tr>
          
        </tbody>
      </table>
    </section>
  </main>

</body>
</html>
